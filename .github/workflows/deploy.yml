name: Atualizar dados e publicar

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 9 5 * *' # dia 5 de cada mês, 06h de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes do ETL
        run: dotnet test

      - name: Atualizar dados do IBGE
        # Se o IBGE estiver fora do ar, segue com os dados já versionados no repositório.
        run: dotnet run --project etl/BrasilMedido.Etl -c Release || echo "::warning::ETL falhou; publicando com os dados existentes."

      - name: Versionar dados atualizados
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data web/public/geo
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados do IBGE"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build do site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npx vitest run
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
